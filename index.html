<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7dce8"><title>היומן שלי ♡</title>
<style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#4e3a47;background:#fff8fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff0f6,#fffafc 40%,#f8f1ff);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:20px 14px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{color:#a86d89;font-size:13px;font-weight:bold}h1{margin:5px 0;font-size:clamp(28px,5vw,40px);color:#8f4b72}.subtitle{color:#927b8a;margin:5px 0 20px}.panel{background:#fffdfef0;border:1px solid #f1d9e5;border-radius:22px;box-shadow:0 10px 35px #b97b9914;padding:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}.weeknav,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #efd1e1;background:white;color:#845473;border-radius:12px;padding:10px 13px;font-weight:700;min-height:42px}.btn:hover{background:#fff0f7}.primary{background:#c66b99;color:white;border-color:#c66b99}.primary:hover{background:#b95b8b}.danger{color:#ae3f65;border-color:#f4ccd9}.weeklabel{font-size:17px;font-weight:800;color:#774360}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{background:#fff;border:1px solid #f0dce6;border-radius:16px;min-height:245px;overflow:hidden}.day.today{border:2px solid #c66b99}.dayhead{padding:12px 8px;background:#fff0f7;border-bottom:1px solid #f2dce8;display:flex;align-items:center;justify-content:space-between;gap:5px}.dayname{font-weight:800;font-size:14px}.date{font-size:12px;color:#9c7890}.daybody{padding:8px;display:flex;flex-direction:column;gap:7px}.event{border:0;border-right:4px solid #d46c9c;border-radius:9px;text-align:right;padding:9px 8px;background:#fce3ee;color:#65425a;width:100%;overflow-wrap:anywhere}.event .time{font-size:11px;font-weight:bold;opacity:.8}.event .title{font-size:13px;font-weight:800;margin-top:4px}.event .note{font-size:11px;margin-top:4px;opacity:.8}.event.study{background:#eee5ff;border-color:#aa83dc}.event.work{background:#ffe0ec;border-color:#d46c9c}.event.sport{background:#e0f5e8;border-color:#7bb995}.event.personal{background:#fff0d9;border-color:#e7ad60}.event.other{background:#e6f0ff;border-color:#8aace2}.addmini{border:1px dashed #e8bfd3;color:#a96a8b;background:#fffafd;border-radius:9px;padding:7px;width:100%;font-size:12px}.empty{color:#b69eac;font-size:12px;text-align:center;padding:12px 0}.hint{font-size:12px;color:#9b8291;margin-top:15px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.legend span{font-size:12px;color:#755a6c}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px}.modal{position:fixed;inset:0;background:#35213080;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.dialog{width:min(100%,460px);max-height:95dvh;overflow:auto;background:#fffafd;border:1px solid #f0cddd;border-radius:22px;padding:20px;box-shadow:0 15px 55px #39213738}.dialog h2{margin:0 0 18px;color:#914d73}.fields{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:bold;color:#765268}.field input,.field select,.field textarea{width:100%;border:1px solid #e8cedb;border-radius:11px;padding:11px;background:white;color:#4e3a47;min-height:44px}.field textarea{resize:vertical;min-height:70px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialogfooter{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}.footer{margin-top:20px;text-align:center;color:#a78b9c;font-size:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:850px){.weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:140px}.day:last-child{grid-column:span 2}.top{align-items:flex-start}.toolbar{align-items:stretch}.weeklabel{font-size:15px}}@media(max-width:370px){.weekgrid{grid-template-columns:1fr}.day:last-child{grid-column:auto}.twocol{grid-template-columns:1fr}.btn{padding:9px}}
.repeatline{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;background:#fff0f7;font-size:14px;font-weight:700}.repeatline input{width:20px;height:20px;accent-color:#c66b99}.recurringmark{font-size:10px;margin-top:5px;opacity:.8}
/* Mobile-first phone experience */
@media(max-width:650px){
 body{background:#fff7fb}.shell{padding:18px 12px 110px}.top{display:block}.top h1{font-size:30px}.subtitle{font-size:13px;margin-bottom:14px}
 .panel{padding:12px;border-radius:20px}.toolbar{display:block}.weeknav{display:grid;grid-template-columns:46px 1fr 46px;gap:7px;align-items:center}.weeknav #prev{grid-column:1;grid-row:1}.weeknav #next{grid-column:3;grid-row:1}.weeklabel{grid-column:2;grid-row:1;text-align:center;font-size:14px}.weeknav #today{grid-column:1 / -1;grid-row:2;width:100%}
 .actions{justify-content:center;margin-top:9px}.actions .btn{flex:1}.legend{gap:9px;margin:13px 0}.legend span{font-size:11px}
 .weekgrid{display:grid;grid-template-columns:1fr;gap:9px}.day,.day:last-child{grid-column:auto;min-height:0;border-radius:14px}.dayhead{padding:10px 12px}.daybody{padding:9px;gap:7px}.event{padding:11px 12px}.event .title{font-size:15px}.event .time{font-size:12px}.addmini{min-height:40px;font-size:13px}.empty{padding:5px}
 .modal{align-items:flex-end;padding:0}.dialog{border-radius:24px 24px 0 0;width:100%;max-height:92dvh;padding:20px 18px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}.field input,.field select,.field textarea{font-size:16px}.twocol{grid-template-columns:1fr 1fr}.dialogfooter .btn{flex:1}
 .mobile-fab{display:flex!important;position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;left:18px;justify-content:center;align-items:center;min-height:56px;border:0;border-radius:18px;background:#bd5c8e;color:white;font-weight:800;font-size:17px;box-shadow:0 8px 28px #9e4c7a55;z-index:5}
}
</style></head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">♡ תכנני את השבוע שלך</div><h1>היומן שלי ✨</h1><p class="subtitle">כל מה שחשוב לך, במקום אחד.</p></div><button class="btn primary" id="newEvent">＋ הוספת פעילות</button></header>
<section class="panel"><div class="toolbar"><div class="weeknav"><button class="btn" id="prev" aria-label="שבוע קודם">❯</button><div class="weeklabel" id="weekLabel"></div><button class="btn" id="next" aria-label="שבוע הבא">❮</button><button class="btn" id="today">השבוע הנוכחי</button></div><div class="actions"><button class="btn" id="export">⬇ גיבוי</button><button class="btn" id="import">⬆ שחזור</button><input class="sr" id="fileInput" type="file" accept="application/json,.json"></div></div><div class="legend"><span><i class="dot" style="background:#d46c9c"></i>עבודה</span><span><i class="dot" style="background:#aa83dc"></i>לימודים</span><span><i class="dot" style="background:#7bb995"></i>אימונים</span><span><i class="dot" style="background:#e7ad60"></i>אישי</span><span><i class="dot" style="background:#8aace2"></i>אחר</span></div><div class="weekgrid" id="weekGrid"></div><div class="hint">לחצי על פעילות כדי לערוך או למחוק אותה. פעילות קבועה תתעדכן בכל השבועות שלה. הנתונים נשמרים בדפדפן הזה בלבד — מומלץ להוריד גיבוי מדי פעם.</div></section><div class="footer">Made with ♡ · היומן שלי</div></main><button type="button" class="mobile-fab" id="mobileAdd" style="display:none">＋ הוספת פעילות</button>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle">פעילות חדשה ♡</h2><form id="eventForm" class="fields"><div class="field"><label for="eventTitle">מה מתוכנן?</label><input id="eventTitle" maxlength="100" placeholder="למשל: משמרת בוקר" required></div><div class="twocol"><div class="field"><label for="eventDate">תאריך</label><input type="date" id="eventDate" required></div><div class="field"><label for="eventType">סוג פעילות</label><select id="eventType"><option value="work">עבודה</option><option value="study">לימודים</option><option value="sport">אימונים</option><option value="personal">אישי</option><option value="other">אחר</option></select></div></div><div class="twocol"><div class="field"><label for="startTime">משעה</label><input type="time" id="startTime"></div><div class="field"><label for="endTime">עד שעה</label><input type="time" id="endTime"></div></div><label class="repeatline"><input type="checkbox" id="repeatWeekly"> 🔁 לחזור על הפעילות בכל שבוע</label><div class="field" id="repeatEndField" hidden><label for="repeatEnd">עד לתאריך (לא חובה — ללא הגבלה)</label><input type="date" id="repeatEnd"></div><div class="field"><label for="eventNote">הערות (לא חובה)</label><textarea id="eventNote" maxlength="350" placeholder="כתובת, דברים לזכור..."></textarea></div><div class="dialogfooter"><button type="button" class="btn" id="cancel">ביטול</button><div class="actions"><button type="button" class="btn danger" id="deleteEvent" hidden>מחיקה</button><button type="submit" class="btn primary">שמירה ♡</button></div></div></form></div></div>
<script>
(()=>{'use strict';const KEY='my-weekly-planner-v1';const $=id=>document.getElementById(id);const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];const types={work:'עבודה',study:'לימודים',sport:'אימונים',personal:'אישי',other:'אחר'};const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const startWeek=d=>add(d,-d.getDay());const fmt=d=>new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long'}).format(d);let events=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))events=x.filter(valid)}catch(e){alert('לא הצלחנו לקרוא את הנתונים השמורים. מומלץ לנסות לשחזר גיבוי.')}let week=startWeek(new Date()),editing=null;function valid(x){return x&&typeof x.id==='string'&&typeof x.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&types[x.type]&&typeof x.start==='string'&&typeof x.end==='string'&&typeof x.note==='string'&&(x.repeatWeekly===undefined||typeof x.repeatWeekly==='boolean')&&(x.repeatEnd===undefined||x.repeatEnd===''||/^\d{4}-\d{2}-\d{2}$/.test(x.repeatEnd))}function save(){try{localStorage.setItem(KEY,JSON.stringify(events));return true}catch(e){alert('השמירה נכשלה. ייתכן שאחסון הדפדפן חסום או מלא. הורידי גיבוי כדי לשמור את השינויים.');return false}}function render(){$('weekLabel').textContent=`${fmt(week)} – ${fmt(add(week,6))} ${add(week,6).getFullYear()}`;const grid=$('weekGrid');grid.replaceChildren();for(let i=0;i<7;i++){const d=add(week,i),date=iso(d),day=document.createElement('div');day.className='day'+(date===iso(new Date())?' today':'');const head=document.createElement('div');head.className='dayhead';const name=document.createElement('span');name.className='dayname';name.textContent=days[i];const dt=document.createElement('span');dt.className='date';dt.textContent=`${d.getDate()}/${d.getMonth()+1}`;head.append(name,dt);const body=document.createElement('div');body.className='daybody';const matches=events.filter(e=>e.date===date||(e.repeatWeekly&&date>=e.date&&(!e.repeatEnd||date<=e.repeatEnd)&&parse(date).getDay()===parse(e.date).getDay())).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));if(!matches.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='יום פנוי ☀️';body.append(empty)}for(const e of matches){const b=document.createElement('button');b.className='event '+e.type;b.type='button';const time=document.createElement('div');time.className='time';time.textContent=e.start?(e.start+(e.end?'–'+e.end:'')):'ללא שעה';const title=document.createElement('div');title.className='title';title.textContent=e.title;b.append(time,title);if(e.repeatWeekly){const mark=document.createElement('div');mark.className='recurringmark';mark.textContent='🔁 קבוע בכל שבוע';b.append(mark)}if(e.note){const note=document.createElement('div');note.className='note';note.textContent=e.note;b.append(note)}b.addEventListener('click',()=>open(e));body.append(b)}const plus=document.createElement('button');plus.type='button';plus.className='addmini';plus.textContent='＋ הוספה';plus.addEventListener('click',()=>open(null,date));body.append(plus);day.append(head,body);grid.append(day)}}function open(e=null,date=iso(new Date())){editing=e?.id||null;$('dialogTitle').textContent=e?'עריכת פעילות ♡':'פעילות חדשה ♡';$('eventTitle').value=e?.title||'';$('eventDate').value=e?.date||date;$('eventType').value=e?.type||'work';$('startTime').value=e?.start||'';$('endTime').value=e?.end||'';$('eventNote').value=e?.note||'';$('repeatWeekly').checked=!!e?.repeatWeekly;$('repeatEnd').value=e?.repeatEnd||'';toggleRepeat();$('deleteEvent').hidden=!e;$('modal').classList.add('open');$('eventTitle').focus()}function toggleRepeat(){$('repeatEndField').hidden=!$('repeatWeekly').checked}$('repeatWeekly').addEventListener('change',toggleRepeat);function close(){$('modal').classList.remove('open');editing=null}$('newEvent').onclick=()=>open(null,iso(new Date()));$('mobileAdd').onclick=()=>open(null,iso(new Date()));$('prev').onclick=()=>{week=add(week,-7);render()};$('next').onclick=()=>{week=add(week,7);render()};$('today').onclick=()=>{week=startWeek(new Date());render()};$('cancel').onclick=close;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('eventForm').addEventListener('submit',e=>{e.preventDefault();const start=$('startTime').value,end=$('endTime').value;if(start&&end&&end<=start){alert('שעת הסיום צריכה להיות אחרי שעת ההתחלה.');return}const repeatWeekly=$('repeatWeekly').checked,repeatEnd=repeatWeekly?$('repeatEnd').value:'';if(repeatEnd&&repeatEnd<$('eventDate').value){alert('תאריך הסיום חייב להיות אחרי תאריך ההתחלה.');return}const obj={repeatWeekly,repeatEnd,id:editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random()),title:$('eventTitle').value.trim(),date:$('eventDate').value,type:$('eventType').value,start,end,note:$('eventNote').value.trim()};if(!obj.title)return;if(editing)events=events.map(x=>x.id===editing?obj:x);else events.push(obj);save();week=startWeek(parse(obj.date));close();render()});$('deleteEvent').onclick=()=>{if(!editing||!confirm('למחוק את הפעילות'+(events.find(e=>e.id===editing)?.repeatWeekly?' הקבועה מכל השבועות':'')+'?'))return;events=events.filter(e=>e.id!==editing);save();close();render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'my-weekly-planner',version:1,exportedAt:new Date().toISOString(),events},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`גיבוי-יומן-${iso(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5e6)throw Error('הקובץ גדול מדי');const obj=JSON.parse(await f.text());if(obj.app!=='my-weekly-planner'||!Array.isArray(obj.events)||!obj.events.every(valid))throw Error('מבנה הקובץ אינו תקין');if(!confirm(`לשחזר ${obj.events.length} פעילויות? פעולה זו תחליף את כל הפעילויות הקיימות בדפדפן הזה.`))return;events=obj.events;save();render();alert('השחזור הושלם בהצלחה ♡')}catch(err){alert('לא ניתן לשחזר את הקובץ: '+err.message)}finally{e.target.value=''}};render()})();
</script></body></html>
